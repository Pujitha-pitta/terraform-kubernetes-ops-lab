services:
  ops-demo:
    build: .
    image: ops-observability-demo:local
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local-compose
      APP_VERSION: 0.1.0
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 20s
      timeout: 3s
      retries: 3
